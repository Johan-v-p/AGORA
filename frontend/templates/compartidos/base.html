<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>
    (() => {
      const serverTheme = {{ tema_usuario|default('', true)|tojson }};
      const storedTheme = localStorage.getItem('agora-theme');
      const preference = serverTheme || storedTheme || 'system';
      const theme = preference === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : preference;
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <title>{% block title %}Ágora{% endblock %} — La plaza de tu universidad</title>

  <!-- Favicon neutro (símbolo griego simple en SVG inline) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬥</text></svg>"/>

  <!-- Fuente principal desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Sistema de diseño global -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/compartidos/base.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/compartidos/sidebar.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/compartidos/componentes.css') }}"/>
  <script src="{{ url_for('static', filename='js/compartidos/interaccion.js') }}"></script>

  <!-- Estilos adicionales por página (cada template los define) -->
  {% block extra_head %}{% endblock %}

  <!-- Utilidades al final: tienen prioridad sobre los estilos de página -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/compartidos/utilidades.css') }}"/>
</head>
<body>

  <!-- ══ MENSAJES FLASH (toasts en esquina inferior derecha) ══ -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="toast-container" id="toast-container">
        {% for category, message in messages %}
          <div class="toast toast--{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- ══ CONTENIDO DE CADA PÁGINA ══ -->
  {% block content %}{% endblock %}

  <!-- ══ SCRIPTS GLOBALES ══ -->
  <script src="{{ url_for('static', filename='js/compartidos/base.js') }}"></script>
  <script src="{{ url_for('static', filename='js/compartidos/tema.js') }}"
          data-tema-usuario="{{ 'true' if usuario_autenticado|default(false) else 'false' }}"
          data-tema-inicial="{{ tema_usuario|default('system', true) }}"></script>

  <!-- Scripts adicionales por página -->
  {% block extra_scripts %}{% endblock %}

</body>
</html>
